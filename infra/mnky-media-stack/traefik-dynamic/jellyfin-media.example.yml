# Drop-in for Traefik **file** provider on 10.0.0.25 (adjust path in static traefik.yml / command).
# Copy to e.g. /etc/traefik/dynamic/jellyfin-media.yml and reload Traefik.
#
# Prerequisites:
#   - Public DNS: media.moodmnky.com → your WAN (or Cloudflare proxy).
#   - pfSense Unbound host override: host `media`, domain `moodmnky.com`, IP `10.0.0.25`
#     (LAN clients must not hairpin to WAN for this hostname).
#   - MOOD-MNKY: allow TCP 8096 from 10.0.0.25 → media LXC (10.1.0.120).
#   - On LXC: python3 scripts/configure-jellyfin-reverse-proxy.py --restart
#   - Set JELLYFIN_URL=https://media.moodmnky.com in .env.secrets and re-run
#     scripts/bootstrap-media-integrations.py (Jellyseerr external hostname).
#
# Replace entryPoints and certResolver names to match your Traefik static config.

http:
  routers:
    jellyfin-media:
      rule: Host(`media.moodmnky.com`)
      entryPoints:
        - websecure
      service: jellyfin-media
      tls:
        certResolver: letsencrypt

  services:
    jellyfin-media:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://10.1.0.120:8096"
