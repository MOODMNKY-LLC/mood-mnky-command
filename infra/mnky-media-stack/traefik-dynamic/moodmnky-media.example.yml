# Traefik file provider — deployed on 10.0.0.25 as /etc/traefik/conf.d/moodmnky-media.yaml
#
# Hosts:
#   https://media.moodmnky.com   → Jellyfin (10.1.0.120:8096)
#   https://media-request.moodmnky.com → Jellyseerr (10.1.0.120:5055)
#
# MOOD MNKY static Traefik uses entryPoint websecure + certResolver cloudflare (DNS-01).
# coolify.yaml has HostRegexp(`*.moodmnky.com`) at priority -1 — these routers use priority 15
# so media + media-request are not sent to Coolify.
#
# If Let's Encrypt logs a transient "No such authorization" on first deploy, reload Traefik again
# after a minute or hit the hostnames from outside to trigger a fresh order.

http:
  routers:
    jellyfin-media:
      rule: Host(`media.moodmnky.com`)
      entryPoints:
        - websecure
      service: jellyfin-media
      priority: 15
      tls:
        certResolver: cloudflare

    jellyseerr-media-request:
      rule: Host(`media-request.moodmnky.com`)
      entryPoints:
        - websecure
      service: jellyseerr-media-request
      priority: 15
      tls:
        certResolver: cloudflare

  services:
    jellyfin-media:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://10.1.0.120:8096"

    jellyseerr-media-request:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://10.1.0.120:5055"
