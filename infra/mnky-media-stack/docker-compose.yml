# MNKY media stack — MOOD-MNKY LXC (Intel iGPU). Config on local disk; libraries on TrueNAS NFS (/mnt/media).
# See README.md for Proxmox GPU passthrough, NetBird, and Gluetun/ProtonVPN.
#
# qBittorrent runs in Gluetun’s network namespace (VPN + port-forward). Other containers still resolve
# hostname `qbittorrent` via a network alias on the `gluetun` service.

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${PROTONVPN_SERVICE_PROVIDER:-protonvpn}
      VPN_TYPE: ${PROTONVPN_VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${PROTONVPN_WIREGUARD_PRIVATE_KEY:?set PROTONVPN_WIREGUARD_PRIVATE_KEY in .env or environment}
      VPN_PORT_FORWARDING: ${PROTONVPN_PORT_FORWARDING:-on}
      VPN_PORT_FORWARDING_PROVIDER: ${PROTONVPN_PORT_FORWARDING_PROVIDER:-protonvpn}
      PORT_FORWARD_ONLY: ${PORT_FORWARD_ONLY:-on}
      SERVER_COUNTRIES: ${PROTONVPN_SERVER_COUNTRIES:-United States}
      FIREWALL_OUTBOUND_SUBNETS: ${GLUETUN_FIREWALL_OUTBOUND_SUBNETS:-10.0.0.0/24,10.1.0.0/24}
      # Sync Proton forwarded port into qBittorrent (requires Web UI “bypass auth for localhost”; see README).
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
    ports:
      - "8081:8080/tcp"
    networks:
      media:
        aliases:
          - qbittorrent

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      PUID: "0"
      PGID: "0"
      TZ: UTC
    volumes:
      - ./config/jellyfin:/config
      # Paths mirror TrueNAS: 10.0.0.5:/mnt/HYPER-MNKY/PRO-MNKY/Media → LXC /mnt/media
      - /mnt/media/Movies:/data/movies
      - /mnt/media/Shows:/data/tvshows
      - /mnt/media/Music:/data/music
      - /mnt/media/Books:/data/books
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "992"
      - "993"
    ports:
      - "8096:8096"
    networks:
      - media

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      PUID: "0"
      PGID: "0"
      TZ: UTC
      WEBUI_PORT: "8080"
    volumes:
      - ./config/qbittorrent:/config
      - /mnt/media/Downloads:/downloads

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: "0"
      PGID: "0"
      TZ: UTC
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    networks:
      - media

  # Optional but recommended: extra Torznab sources; Prowlarr can add "Jackett - all" as Torznab alongside native Cardigann indexers.
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    restart: unless-stopped
    environment:
      PUID: "0"
      PGID: "0"
      TZ: UTC
    volumes:
      - ./config/jackett:/config
    ports:
      - "9117:9117"
    networks:
      - media

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: "0"
      PGID: "0"
      TZ: UTC
    volumes:
      - ./config/sonarr:/config
      - /mnt/media/Shows:/tv
      - /mnt/media/Downloads:/downloads
    ports:
      - "8989:8989"
    networks:
      - media

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      PUID: "0"
      PGID: "0"
      TZ: UTC
    volumes:
      - ./config/radarr:/config
      - /mnt/media/Movies:/movies
      - /mnt/media/Downloads:/downloads
    ports:
      - "7878:7878"
    networks:
      - media

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      PUID: "0"
      PGID: "0"
      TZ: UTC
    volumes:
      - ./config/lidarr:/config
      - /mnt/media/Music:/music
      - /mnt/media/Downloads:/downloads
    ports:
      - "8686:8686"
    networks:
      - media

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    environment:
      TZ: UTC
    volumes:
      - ./config/jellyseerr:/app/config
    ports:
      - "5055:5055"
    networks:
      - media

networks:
  media:
    driver: bridge
